# KidulWM keybinding configuration
# Place this file at ~/.config/kidulwm/keybinds.conf
# If the file is missing or any line is invalid, KidulWM falls back to the
# built-in defaults silently and logs why.

# Launcher / terminal ("open slide" in old Kidul terms)
Mod4+Return     = open_slide

# Slide/window navigation
Mod4+j          = focus_next
Mod4+k          = focus_prev

# Dock / tray
Mod4+t          = tray_toggle
Mod4+Down       = tray_select_next
Mod4+Up         = tray_select_prev

# Activate selected tray item. Keep this different from open_slide if you want
# both to be independently usable, or bind the same key to only one of them.
Mod4+space      = tray_activate

# Animation preset selection (cycle through snap/wobble/ripple)
Mod4+a          = next_animation

# Example custom application spawn:
# Mod4+b          = spawn /usr/bin/firefox
