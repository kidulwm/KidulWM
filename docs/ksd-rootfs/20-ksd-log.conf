# KSD: make the graph visible at boot (2026-11-27, bobdotrix).
#
# WHY: at the default log level (2 = warn) pipewire logs nothing about ALSA
# device opens or node creation, so a boot log CANNOT distinguish "no sink in
# the graph" from "sink fine, stream unlinked". That ambiguity has cost two
# sessions of misdiagnosis. INFO (3) prints one line per node/device open and
# per adapter creation — cheap, bounded, and it lands in
# /var/log/kushd-pipewire.log every boot.
context.properties = {
    log.level = 3
}
