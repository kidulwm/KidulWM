# HEADPHONE JACK (2026-11-27): there is no separate headphone sink and none is
#   needed. The ALC295 exposes ONE analog playback PCM (hw:0,0 -> DAC node 0x02);
#   the headphone jack is PIN node 0x21 "[Jack] HP Out" on that same DAC, the
#   internal speakers are pin 0x14. So this sink IS the headphone jack. A second
#   "headphones" adapter on hw:0,0 would fail: a hw PCM opens once, and two
#   nodes on one PCM fight for it. Verified end-to-end in a chroot (pulse ->
#   pipewire -> this sink -> pcm0p RUNNING -> codec pin 0x21).
# KSD: ALSA sinks WITHOUT udev.
#
# WHY THIS FILE EXISTS (2026-11-27, proven from the m.2 log trail):
#   KSD runs stock PipeWire + WirePlumber, but the ALSA support library on the
#   image ships exactly ONE device enumerator: `api.alsa.enum.udev`
#   (libspa-alsa.so imports udev_device_new_from_syspath / udev_monitor_*).
#   KSD has no udev: no /lib/udev, no udevd, no /run/udev database. So
#   WirePlumber's monitor.alsa enumerates ZERO devices, every boot, silently --
#   /var/log/kushd-wireplumber.log has never carried a single ALSA line in 49
#   boots. With no sink in the graph, every client stream (kplayd's pa_simple
#   under the hardcoded name "kmedia") links to nothing, parks in PAUSED and
#   is torn down: no sound, and the player closes with it.
#
# WHAT IT DOES: declares the two PCM sinks explicitly, bypassing enumeration.
#   This is the same object WirePlumber's alsa monitor would create, built with
#   the adapter factory (present on the image: libpipewire-module-adapter.so +
#   api.alsa.pcm.sink from libspa-alsa.so). No new daemon, no udev.
#
# CARD/DEVICE: kboot's devrules enumerate card 0 = HDA Intel PCH
#   (pcmC0D0p analog speakers, pcmC0D3p HDMI 0 = the TV). Card 1 is the
#   discrete GPU's HDA (HDMI only). Numeric indices match kboot's own view.
#
# SWITCHING OUTPUT: analog is the default (host parity: the CachyOS host also
#   defaults to Built-in Analog Stereo with a TV attached). HDMI rides the graph
#   as a second sink for ksound/the settings surface to select.

context.objects = [
    # --- analog speakers / headphone jack (default) ---
    {   factory = adapter
        args = {
            factory.name         = api.alsa.pcm.sink
            node.name            = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            node.description     = "Built-in Audio - speakers + headphone jack (KSD)"
            media.class          = "Audio/Sink"
            api.alsa.path        = "hw:0,0"
            api.alsa.period-size = 1024
            api.alsa.headroom    = 2048
            audio.channels       = 2
            audio.rate           = 48000
            priority.session     = 1000
            priority.driver      = 1000
            node.pause-on-idle   = false
        }
    }
    # --- HDMI 0 = the TV ---
    {   factory = adapter
        args = {
            factory.name         = api.alsa.pcm.sink
            node.name            = "alsa_output.pci-0000_00_1f.3.hdmi-stereo"
            node.description     = "Built-in Audio HDMI (TV)"
            media.class          = "Audio/Sink"
            api.alsa.path        = "hw:0,3"
            api.alsa.period-size = 1024
            api.alsa.headroom    = 2048
            audio.channels       = 2
            audio.rate           = 48000
            priority.session     = 900
            priority.driver      = 900
            node.pause-on-idle   = false
        }
    }
]
