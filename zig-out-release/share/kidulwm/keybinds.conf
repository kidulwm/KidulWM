# KidulWM keybinding configuration
# Place this file at ~/.config/kidulwm/keybinds.conf
# If it is missing or invalid, KidulWM falls back to the built-in defaults.

# Launcher / terminal ("open slide")
Mod4+Return     = open_slide

# Slide/window navigation
Mod4+j          = focus_next
Mod4+k          = focus_prev

# Dock / tray
Mod4+t          = tray_toggle
Mod4+Right      = tray_select_next
Mod4+Left       = tray_select_prev
Mod4+space      = tray_activate

# Animation preset selection
Mod4+a          = next_animation

# Example custom spawn:
# Mod4+b          = spawn /usr/bin/firefox
